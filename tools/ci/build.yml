name: Build CamPDF APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-debug.log

      - name: Show compile errors (if any)
        if: failure()
        run: |
          echo "=== Kotlin / resource errors ==="
          grep -nE "^e: |error:|What went wrong|Execution failed|Could not " -A4 build-debug.log | head -120 || true

      - name: Lint report (does not stop the build)
        continue-on-error: true
        run: gradle lintDebug --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Build release APK
        continue-on-error: true
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build-release.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: build-*.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: CamPDF-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: CamPDF-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: APK size
        if: always()
        run: |
          echo "### APK size" >> "$GITHUB_STEP_SUMMARY"
          ls -l app/build/outputs/apk/*/*.apk 2>/dev/null | awk '{printf "- %s: %.2f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY" || true

  # v3.9: the engine tests that run on a normal PC (no Android needed): PDF writer / reader, merge / reorder /
  # extract, AES-256 lock (checked with qpdf and poppler), auto-capture tracker. A failure marks the run red.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler and PDF checkers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils
          curl -sSL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kc.zip

      - name: Run PC tests
        run: |
          set -e
          A=app/src/main/java/com/campdf/app
          kotlinc/bin/kotlinc tools/jvmtest/PdfTests.kt $A/PdfWriter.kt $A/PdfFile.kt $A/PdfDoc.kt $A/PdfCrypt.kt \
              $A/Bitonal.kt $A/Mrc.kt $A/PdfA.kt $A/LiveTracker.kt -include-runtime -d pdftests.jar
          java -jar pdftests.jar out
          qpdf --check out/merged.pdf
          qpdf --check out/bw.pdf
          qpdf --check out/mrc_merged.pdf
          qpdf --password='සිංහල pass 123' --check out/locked.pdf
          if qpdf --password=wrong --check out/locked.pdf >/dev/null 2>&1; then echo "wrong password accepted"; exit 1; fi
          pdftoppm -r 20 -png out/merged.pdf m
          pdftoppm -upw 'සිංහල pass 123' -r 20 -png out/locked.pdf l
          for i in 1 2 3; do cmp m-$i.png l-$i.png; done
          echo "locked copy renders identical to the original"

